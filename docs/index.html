<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レコードウィジェット</title>
<meta name="theme-color" content="#1c130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="レコード">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c130f; --onbg: #f3e9d2; --onbgsub: #b9a58f; --card: #f3e9d2; --text: #2a1f1a;
    --sub: #7a6a5c; --sep: #e0d2b6; --red: #c62828; --mustard: #e0a526;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--onbg);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    background-image: radial-gradient(ellipse at 50% -10%, rgba(255,200,140,.18), transparent 60%),
      repeating-linear-gradient(178deg, rgba(255,224,178,.05) 0 1px, transparent 1px 22px);
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px);
    min-height: 100vh;
  }
  header { display: flex; align-items: baseline; gap: 10px; padding: 22px 20px 6px; }
  h1 { font-family: var(--serif); font-size: 26px; letter-spacing: .12em; margin: 0; }
  .who { margin-left: auto; font-size: 13px; color: var(--mustard); background: none; border: 1px solid #6b5848;
         border-radius: 14px; padding: 4px 10px; font-family: var(--serif); }
  .player {
    margin: 14px 16px 0; background: var(--red); border-radius: 22px; padding: 12px 12px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .deck { background: #f2e8d6; border-radius: 14px; padding: 18px; display: flex; align-items: center; gap: 16px; }
  .disc {
    width: 46vw; max-width: 220px; aspect-ratio: 1; border-radius: 50%; flex: none; position: relative;
    background: repeating-radial-gradient(circle, #151515 0 3px, #222 3px 5px); box-shadow: 0 0 0 6px #e0d4bd;
  }
  .disc::after {
    content: ""; position: absolute; inset: 36%; border-radius: 50%;
    background: radial-gradient(circle, #1c130f 0 8%, #e6511a 9% 100%); box-shadow: inset 0 0 0 4px #f6c08f;
  }
  .disc.spin { animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .keys { display: flex; flex-direction: column; gap: 10px; flex: 1; align-items: center; }
  .keys button {
    width: 64px; height: 48px; border: 0; border-radius: 10px; background: #fbf5e8; font-size: 20px; color: var(--text);
    box-shadow: 0 3px 0 #d6c8ae;
  }
  .keys button.main { width: 76px; height: 60px; font-size: 26px; color: var(--red); }
  .now { text-align: center; color: #fff; font-family: var(--serif); font-size: 18px; padding: 12px 8px 14px;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap { display: flex; align-items: center; gap: 10px; padding: 28px 22px 10px; color: var(--mustard);
         font-family: var(--serif); letter-spacing: .1em; font-size: 16px; }
  .cap::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid var(--mustard); }
  .card { margin: 0 16px; background: linear-gradient(var(--card), #ebddbf); border-radius: 16px; color: var(--text);
          overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; min-height: 58px; }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .rank { color: var(--red); font-family: var(--serif); font-size: 13px; min-width: 22px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-family: var(--serif); font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t small { color: var(--sub); font-size: 12.5px; }
  .row.playing b { color: var(--red); }
  .like { border: 0; background: none; font-size: 15px; color: var(--sub); padding: 8px 4px 8px 10px; white-space: nowrap; }
  .like.on { color: var(--red); }
  .note { color: var(--onbgsub); font-size: 12.5px; padding: 8px 22px 0; line-height: 1.6; }
  .empty { color: var(--sub); text-align: center; padding: 20px; font-size: 14px; }
  .action { width: 100%; border: 0; background: none; text-align: left; font-size: 16px; color: var(--text); }
  .action::before { content: "＋"; color: var(--red); margin-right: 12px; }
  dialog { border: 0; border-radius: 18px; background: var(--card); color: var(--text); width: min(92vw, 420px); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 8px; }
  dialog p { font-size: 14px; color: var(--sub); line-height: 1.6; margin: 6px 0 12px; }
  dialog input[type=text] { width: 100%; font-size: 17px; padding: 10px; border: 1px solid #cdbd9e; border-radius: 10px; background: #fffaf0; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  dialog .btns button { font-size: 16px; border: 0; border-radius: 10px; padding: 10px 16px; background: #e6d8bb; color: var(--text); }
  dialog .btns .primary { background: var(--red); color: #fff; }
  dialog .btns .danger { background: none; color: #b3261e; margin-right: auto; }
  dialog ol { padding-left: 1.6em; margin: 8px 0; max-height: 40vh; overflow: auto; }
  dialog li { padding: 4px 0; }
  label.sw { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
           background: #2a1f1a; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0;
           transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>レコード</h1>
  <button class="who" id="who">名前を決める</button>
</header>

<div class="player">
  <div class="deck">
    <div class="disc" id="disc"></div>
    <div class="keys">
      <button id="prev" aria-label="前の曲">⏮</button>
      <button id="play" class="main" aria-label="再生">▶</button>
      <button id="next" aria-label="次の曲">⏭</button>
    </div>
  </div>
  <div class="now" id="now">リストを選んでください</div>
</div>

<div class="cap">みんなのリスト</div>
<div class="card" id="public"><div class="empty">読み込み中…</div></div>

<div class="cap">マイリスト</div>
<div class="card" id="mine"></div>
<p class="note">iPhone では、Safari の共有ボタン →「ホーム画面に追加」でアプリのように使えます。ホーム画面から開けば、名前が消えずに残ります。</p>

<audio id="audio" preload="auto"></audio>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
const BASE = "https://lrpllrygddwccvbjawug.supabase.co";
const KEY = "sb_publishable_h0uLDg-ljtms3hQG9F0Ctg_k-l3T5ez"; // publishable: the database rules do the protecting
const ALLOWED = ["audio/mp4", "audio/m4a", "audio/x-m4a", "audio/aac", "audio/mpeg"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- session (anonymous member, kept in localStorage) ---------------------------------
let tokenPromise = null;
function token() {
  if (!tokenPromise) tokenPromise = getToken().finally(() => (tokenPromise = null));
  return tokenPromise;
}
async function getToken() {
  const s = JSON.parse(localStorage.getItem("session") || "null");
  const now = Date.now() / 1000;
  if (s && now < s.expires - 60) return s.access;
  let j;
  if (s && s.refresh) {
    const r = await raw("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh });
    if (r.ok) j = await r.json();
    else if (![400, 401, 403].includes(r.status)) throw new Error("HTTP " + r.status);
  }
  if (!j) {
    const r = await raw("POST", "/auth/v1/signup", { data: {} });
    if (!r.ok) throw new Error(await errText(r));
    j = await r.json();
  }
  localStorage.setItem("session", JSON.stringify({
    access: j.access_token, refresh: j.refresh_token, expires: now + (j.expires_in || 3600), uid: j.user.id,
  }));
  return j.access_token;
}
const uid = () => JSON.parse(localStorage.getItem("session") || "{}").uid;

function raw(method, path, body, auth, extra = {}) {
  const headers = { apikey: KEY, ...extra };
  if (auth) headers.Authorization = "Bearer " + auth;
  let data = body;
  if (body !== undefined && !(body instanceof Blob)) {
    headers["Content-Type"] = "application/json";
    data = JSON.stringify(body);
  }
  return fetch(BASE + path, { method, headers, body: data });
}
async function errText(r) {
  const t = await r.text();
  try { const j = JSON.parse(t); return "HTTP " + r.status + ": " + (j.message || j.msg || j.error_description || ""); }
  catch { return "HTTP " + r.status; }
}
async function api(method, path, body, prefer = "return=minimal", extra = {}) {
  const r = await raw(method, path, body, await token(), { Prefer: prefer, ...extra });
  if (!r.ok) throw new Error(await errText(r));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ---- data -----------------------------------------------------------------------------
let profile = null, likes = new Set(), publicLists = [], myLists = [];
const SELECT = "select=id,title,owner,is_public,like_count,profiles!owner(name),playlist_tracks(count)";

async function load() {
  try {
    await token();
    const [p, pub] = await Promise.all([
      api("GET", "/rest/v1/profiles?select=name,is_admin&id=eq." + uid()),
      api("GET", "/rest/v1/playlists?" + SELECT + "&is_public=eq.true&order=like_count.desc,created_at.desc&limit=100"),
    ]);
    profile = p[0] || null;
    publicLists = pub;
    if (profile) {
      const [mine, lk] = await Promise.all([
        api("GET", "/rest/v1/playlists?" + SELECT + "&owner=eq." + uid() + "&order=created_at.desc"),
        api("GET", "/rest/v1/likes?select=playlist_id&user_id=eq." + uid()),
      ]);
      myLists = mine;
      likes = new Set(lk.map((x) => x.playlist_id));
    }
    render();
    if (!profile && !sessionStorage.getItem("askedName")) { sessionStorage.setItem("askedName", "1"); askName(); }
  } catch (e) {
    $("public").innerHTML = `<div class="empty">読み込めませんでした（${esc(e.message)}）</div>`;
  }
}

const count = (l) => (l.playlist_tracks && l.playlist_tracks[0] ? l.playlist_tracks[0].count : 0);
const owner = (l) => (l.profiles && l.profiles.name) || "だれか";

function render() {
  $("who").textContent = profile ? profile.name + (profile.is_admin ? "（管理者）" : "") : "名前を決める";
  const pub = $("public");
  pub.innerHTML = publicLists.length ? "" : `<div class="empty">まだ公開されているリストはありません</div>`;
  publicLists.forEach((l, i) => {
    const on = likes.has(l.id);
    const row = document.createElement("div");
    row.className = "row" + (queueList === l.id ? " playing" : "");
    row.innerHTML = `<span class="rank">${String(i + 1).padStart(2, "0")}</span>
      <div class="t"><b>${esc(l.title)}</b><small>${esc(owner(l))} ・ ${count(l)}曲</small></div>
      <button class="like ${on ? "on" : ""}" aria-label="いいね">${on ? "♥" : "♡"} ${l.like_count}</button>`;
    row.querySelector(".like").onclick = (ev) => { ev.stopPropagation(); toggleLike(l); };
    row.onclick = () => openList(l);
    pub.appendChild(row);
  });
  const mine = $("mine");
  mine.innerHTML = `<div class="row"><button class="action" id="create">音声ファイルからリストを作る</button></div>`;
  $("create").onclick = () => needName(createList);
  myLists.forEach((l) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div class="t"><b>${esc(l.title)}</b><small>${count(l)}曲 ・ ${l.is_public ? "公開中" : "非公開"} ・ ♥ ${l.like_count}</small></div>`;
    row.onclick = () => openList(l);
    mine.appendChild(row);
  });
}

// ---- dialogs --------------------------------------------------------------------------
function dialog(html, wire) {
  const d = $("dlg");
  d.innerHTML = html;
  wire && wire(d);
  d.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => d.close()));
  if (!d.open) d.showModal();
  return d;
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2800);
}

function needName(then) { profile ? then() : askName(then); }

function askName(then) {
  dialog(`<h2>ニックネーム</h2>
    <p>みんなのリストに表示される名前です。</p>
    <input type="text" id="nm" maxlength="20" placeholder="例：こういち" value="${esc(profile ? profile.name : "")}">
    <div class="btns"><button data-close>あとで</button><button class="primary" id="ok">決定</button></div>`, (d) => {
    d.querySelector("#ok").onclick = async () => {
      const name = d.querySelector("#nm").value.trim();
      if (!name) return toast("名前を入れてください");
      try {
        if (profile) await api("PATCH", "/rest/v1/profiles?id=eq." + uid(), { name });
        else await api("POST", "/rest/v1/profiles", { id: uid(), name });
        d.close();
        toast("登録しました");
        await load();
        then && then();
      } catch (e) { toast("登録できませんでした（" + e.message + "）"); }
    };
  });
}
$("who").onclick = () => askName();

async function toggleLike(l) {
  needName(async () => {
    try {
      if (likes.has(l.id)) await api("DELETE", `/rest/v1/likes?playlist_id=eq.${l.id}&user_id=eq.${uid()}`);
      else await api("POST", "/rest/v1/likes", { playlist_id: l.id, user_id: uid() });
      await load();
    } catch (e) { toast(e.message); }
  });
}

async function openList(l) {
  let tracks;
  try {
    tracks = await api("GET", `/rest/v1/playlist_tracks?select=id,title,storage_path&playlist_id=eq.${l.id}&order=position`);
  } catch (e) { return toast("読み込めませんでした（" + e.message + "）"); }
  const isMine = l.owner === uid();
  const canDelete = isMine || (profile && profile.is_admin);
  dialog(`<h2>${esc(l.title)}</h2>
    <p>${esc(owner(l))} ・ ♥ ${l.like_count}</p>
    <ol>${tracks.map((t) => `<li>${esc(t.title)}</li>`).join("") || "<li>曲がありません</li>"}</ol>
    ${isMine ? `<label class="sw"><input type="checkbox" id="pub" ${l.is_public ? "checked" : ""}> みんなに公開する</label>` : ""}
    <div class="btns">
      ${canDelete ? `<button class="danger" id="del">削除</button>` : ""}
      <button data-close>閉じる</button>
      ${tracks.length ? `<button class="primary" id="listen">聴く</button>` : ""}
    </div>`, (d) => {
    const listen = d.querySelector("#listen");
    if (listen) listen.onclick = () => { d.close(); playList(l, tracks, 0); };
    const pub = d.querySelector("#pub");
    if (pub) pub.onchange = async () => {
      try { await api("PATCH", "/rest/v1/playlists?id=eq." + l.id, { is_public: pub.checked }); toast(pub.checked ? "公開しました" : "非公開にしました"); load(); }
      catch (e) { toast(e.message); }
    };
    const del = d.querySelector("#del");
    if (del) del.onclick = async () => {
      if (!confirm(isMine ? "このリストを削除しますか？アップロードした音声も消えます。" : `管理者として${owner(l)}さんのリストを削除しますか？`)) return;
      try {
        const paths = tracks.map((t) => t.storage_path);
        if (paths.length) {
          const r = await raw("DELETE", "/storage/v1/object/audio", { prefixes: paths }, await token());
          if (!r.ok) throw new Error(await errText(r));
        }
        await api("DELETE", "/rest/v1/playlists?id=eq." + l.id);
        d.close();
        toast("削除しました");
        load();
      } catch (e) { toast("削除できませんでした（" + e.message + "）"); }
    };
  });
}

function createList() {
  dialog(`<h2>新しいリスト</h2>
    <p>iPhone の「ファイル」やボイスメモから書き出した音声（m4a・mp3、1曲50MBまで）を選べます。選んだ順に入ります。</p>
    <input type="text" id="tt" maxlength="40" placeholder="リストの名前">
    <p><input type="file" id="files" accept="audio/*,.m4a,.mp3,.aac" multiple></p>
    <label class="sw"><input type="checkbox" id="pub" checked> みんなに公開する</label>
    <div class="btns"><button data-close>やめる</button><button class="primary" id="up">アップロード</button></div>`, (d) => {
    d.querySelector("#up").onclick = async () => {
      const title = d.querySelector("#tt").value.trim();
      const files = [...d.querySelector("#files").files];
      const isPublic = d.querySelector("#pub").checked;
      if (!title) return toast("リストの名前を入れてください");
      if (!files.length) return toast("音声ファイルを選んでください");
      const bad = files.find((f) => f.size > 50 * 1024 * 1024 || !typeOf(f));
      if (bad) return toast(`「${bad.name}」は使えません（m4a・mp3、50MBまで）`);
      const btn = d.querySelector("#up");
      btn.disabled = true;
      try {
        await upload(title, isPublic, files, (i) => (btn.textContent = `${i + 1} / ${files.length} 曲目…`));
        d.close();
        toast(isPublic ? "公開しました" : "非公開で保存しました");
        load();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "アップロード";
        toast("アップロードできませんでした（" + e.message + "）");
      }
    };
  });
}

function typeOf(f) {
  if (ALLOWED.includes(f.type)) return f.type;
  const ext = f.name.split(".").pop().toLowerCase();
  return { m4a: "audio/mp4", mp4: "audio/mp4", aac: "audio/aac", mp3: "audio/mpeg" }[ext] || null;
}

async function upload(title, isPublic, files, progress) {
  const total = files.reduce((a, f) => a + f.size, 0);
  const used = Number(await api("POST", "/rest/v1/rpc/storage_used", {})) || 0;
  if (used + total > 1e9) throw new Error(`保存場所がいっぱいです（使用 ${Math.round(used / 1e6)}MB / 1000MB）`);
  const me = uid();
  const [list] = await api("POST", "/rest/v1/playlists", { owner: me, title, is_public: false }, "return=representation");
  const done = [];
  try {
    const rows = [];
    for (let i = 0; i < files.length; i++) {
      progress(i);
      const f = files[i];
      const type = typeOf(f);
      const ext = type === "audio/mpeg" ? "mp3" : type === "audio/aac" ? "aac" : "m4a";
      const path = `${me}/${list.id}/${i}.${ext}`;
      const r = await raw("POST", "/storage/v1/object/audio/" + path, new Blob([f], { type }), await token(), { "Content-Type": type });
      if (!r.ok) throw new Error(await errText(r));
      done.push(path);
      rows.push({ playlist_id: list.id, position: i, title: f.name.replace(/\.[^.]+$/, "").slice(0, 80) || `トラック${i + 1}`, storage_path: path, size_bytes: f.size });
    }
    await api("POST", "/rest/v1/playlist_tracks", rows);
    if (isPublic) await api("PATCH", "/rest/v1/playlists?id=eq." + list.id, { is_public: true });
  } catch (e) {
    if (done.length) await raw("DELETE", "/storage/v1/object/audio", { prefixes: done }, await token()).catch(() => {});
    await api("DELETE", "/rest/v1/playlists?id=eq." + list.id).catch(() => {});
    throw e;
  }
}

// ---- player ---------------------------------------------------------------------------
const audio = $("audio");
let queue = [], qi = 0, queueList = null, queueTitle = "";

async function signed(path) {
  const j = await api("POST", "/storage/v1/object/sign/audio/" + path, { expiresIn: 3600 });
  const rel = j.signedURL || j.signedUrl;
  return rel.startsWith("http") ? rel : BASE + "/storage/v1" + rel;
}

async function playList(l, tracks, start) {
  queue = tracks; qi = start; queueList = l.id; queueTitle = l.title;
  render();
  await playAt(qi);
}

async function playAt(i) {
  if (!queue.length) return;
  qi = (i + queue.length) % queue.length;
  const t = queue[qi];
  $("now").textContent = t.title;
  try {
    audio.src = await signed(t.storage_path);
    await audio.play();
  } catch (e) {
    toast("再生できませんでした（" + e.message + "）");
  }
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: queueTitle, artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }],
    });
  }
}

audio.onplay = () => { $("disc").classList.add("spin"); $("play").textContent = "❚❚"; };
audio.onpause = () => { $("disc").classList.remove("spin"); $("play").textContent = "▶"; };
audio.onended = () => playAt(qi + 1);
$("play").onclick = () => {
  if (!queue.length) return toast("みんなのリストから選んでください");
  audio.paused ? audio.play() : audio.pause();
};
$("disc").onclick = () => $("play").click();
$("next").onclick = () => playAt(qi + 1);
$("prev").onclick = () => (audio.currentTime > 3 ? (audio.currentTime = 0) : playAt(qi - 1));
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", () => playAt(qi + 1));
  navigator.mediaSession.setActionHandler("previoustrack", () => playAt(qi - 1));
}

load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
